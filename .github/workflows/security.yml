name: Security & Dependencies

on:
  schedule:
    # Run security checks weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run security audit
        run: npm audit --audit-level moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          # Check for vulnerabilities in dependencies using npm audit
          npm audit --audit-level high || true
        continue-on-error: true

      - name: SARIF Audit
        run: |
          npm audit --json > audit.json || true
          npx audit-ci --config audit-ci.json || true
        continue-on-error: true

      - name: Check license compatibility
        run: npx license-checker --summary
        continue-on-error: true

  dependency-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update dependencies
        run: |
          npm update
          npm audit fix --force || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies and fix security vulnerabilities'
          title: 'Automated dependency updates'
          body: |
            This PR contains automated dependency updates and security fixes.

            Please review the changes carefully before merging.

            Generated by GitHub Actions.
          branch: automated-dependency-updates
          delete-branch: true
