name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Bypass npm cli bug #8767: use npm install instead of npm ci
        # Clean install for reproducibility
        run: |
          rm -rf node_modules
          npm install

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Validate package
        run: npm run validate
